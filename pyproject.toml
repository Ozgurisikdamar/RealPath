[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relpath"
version = "0.1.0"
description = "The open-source, self-hostable relational prediction engine. Connect a database, ask a predictive question in plain language, get an explained answer — local-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "relpath.dev" }]
keywords = ["relational deep learning", "predictive query", "automl", "feature engineering", "duckdb", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

# Core stays permissively licensed (MIT/BSD/Apache) and torch-free.
dependencies = [
    "duckdb>=0.10",
    "pandas>=2.0,<2.3",   # PINNED: pandas 3.0 breaks woodwork's .ww accessor (see docs/DECISIONS.md ADR-001)
    "numpy>=1.24",
    "featuretools>=1.30",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "sqlglot>=23",
]

[project.optional-dependencies]
# Natural-language -> PQL via Claude (falls back to offline templates if absent)
nlp = ["anthropic>=0.40"]
# Local explanations
explain = ["shap>=0.44"]
# Small-data tabular foundation model
tabpfn = ["tabpfn>=0.1"]
# Interactive demo
demo = ["streamlit>=1.30"]
# RelBench evaluation harness (pulls in torch + pyg — kept isolated from the core)
eval = ["relbench>=1.0", "torch>=2.0", "torch-frame>=0.2"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
relpath = "relpath.cli:main"

[project.urls]
Homepage = "https://github.com/Ozgurisikdamar/relpath"
Repository = "https://github.com/Ozgurisikdamar/relpath"
Issues = "https://github.com/Ozgurisikdamar/relpath/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["relpath*"]

[tool.setuptools.package-data]
relpath = ["templates/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# demo_app suppresses warnings before importing heavy libs — intentional import order.
"relpath/demo_app.py" = ["E402"]
