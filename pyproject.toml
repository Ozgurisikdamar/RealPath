[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realpath"
version = "0.1.0"
description = "The open-source, self-hostable relational prediction engine. Connect a database, ask a predictive question in plain language, get an explained answer — local-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "realpath.dev" }]
keywords = ["relational deep learning", "predictive query", "automl", "feature engineering", "duckdb", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

# Core stays permissively licensed (MIT/BSD/Apache) and torch-free.
dependencies = [
    "duckdb>=0.10",
    "pandas>=2.0,<2.3",   # PINNED: pandas 3.0 breaks woodwork's .ww accessor (see docs/DECISIONS.md ADR-001)
    "numpy>=1.24",
    "featuretools>=1.30",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "sqlglot>=23",
]

[project.optional-dependencies]
# Natural-language -> PQL via Claude (falls back to offline templates if absent)
nlp = ["anthropic>=0.40"]
# Local explanations
explain = ["shap>=0.44"]
# PostgreSQL connector
postgres = ["psycopg[binary]>=3.1"]
# MySQL connector
mysql = ["pymysql>=1.1"]
# Small-data tabular foundation model
tabpfn = ["tabpfn>=0.1"]
# Interactive demo (segmented control, width="stretch", theme.sidebar; its AppTest smoke tests
# need AppTest.segmented_control, first shipped in 1.57 — verified on 1.57, 1.58 and 1.64)
demo = ["streamlit>=1.57"]
# RelBench evaluation harness + GNN backend (heavy; isolate in a separate venv — NOT core).
# Note: the GNN's temporal neighbor sampling also needs torch-sparse (and pyg-lib on Linux for
# leakage-safe temporal sampling), installed from the PyG wheel index:
#   pip install torch-sparse -f https://data.pyg.org/whl/torch-${TORCH}+cpu.html
eval = ["relbench>=1.0", "torch>=2.0", "pytorch-frame>=0.2", "torch-geometric>=2.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
realpath = "realpath.cli:main"

[project.urls]
Homepage = "https://github.com/Ozgurisikdamar/realpath"
Repository = "https://github.com/Ozgurisikdamar/realpath"
Issues = "https://github.com/Ozgurisikdamar/realpath/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["realpath*"]

[tool.setuptools.package-data]
realpath = ["templates/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# demo_app suppresses warnings before importing heavy libs — intentional import order.
"realpath/demo_app.py" = ["E402"]
