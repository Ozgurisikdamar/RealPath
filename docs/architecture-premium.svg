  <path d="M332 446 C380 446 380 460 432 460" stroke="#6366F1" stroke-width="3"/>
  <path d="M420 452l12 8-12 8" stroke="#6366F1" stroke-width="3"/>

  <path d="M582 340 V382" stroke="#38BDF8" stroke-width="3"/>
  <path d="M574 370l8 12 8-12" stroke="#38BDF8" stroke-width="3"/>

  <path d="M582 540 V586" stroke="#10B981" stroke-width="3"/>
  <path d="M574 574l8 12 8-12" stroke="#10B981" stroke-width="3"/>

  <path d="M732 665 H834" stroke="#38BDF8" stroke-width="3"/>
  <path d="M822 657l12 8-12 8" stroke="#38BDF8" stroke-width="3"/>

  <path d="M979 352 V398" stroke="#6366F1" stroke-width="3"/>
  <path d="M971 386l8 12 8-12" stroke="#6366F1" stroke-width="3"/>

  <path d="M979 548 V594" stroke="#A855F7" stroke-width="3"/>
  <path d="M971 582l8 12 8-12" stroke="#A855F7" stroke-width="3"/>

  <path d="M1124 669 C1174 669 1174 290 1226 290" stroke="#10B981" stroke-width="3"/>
  <path d="M1214 282l12 8-12 8" stroke="#10B981" stroke-width="3"/>

  <path d="M1368 376 V424" stroke="#38BDF8" stroke-width="3"/>
  <path d="M1360 412l8 12 8-12" stroke="#38BDF8" stroke-width="3"/>
</g>

<!-- Footer -->
<rect x="60" y="866" width="1480" height="42" rx="14" fill="#0B1421" stroke="#1F3348"/>
<text x="800" y="892" text-anchor="middle" class="mini">connect → infer relationships → compile predictive task → isolate time → synthesize features → train → explain</text>
</svg>